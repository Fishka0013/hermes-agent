name: Hermes Fork Verified Delivery

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: hermes-fork-delivery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  delivery-tests:
    name: Hermes fork / tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - name: Read-only PR checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Select Python interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Check patch hygiene
        run: git diff --check HEAD^1 HEAD

      - name: Test read-only change guard
        run: python3 -B -m unittest discover -s tests/tools -p test_hermes_ci_guard.py -v

      - name: Test GitHub publisher (including providerless end-to-end)
        run: python3 -B -m unittest discover -s tests/tools -p 'test_hermes_gh*.py' -v

      - name: Scan changed files, Python syntax and obvious secrets
        run: python3 -B tools/hermes_ci_guard.py --base HEAD^1 --head HEAD

  verified-delivery:
    name: Hermes fork / verified delivery
    if: always()
    needs: [delivery-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail closed unless both Python checks pass
        env:
          MATRIX_RESULT: ${{ needs.delivery-tests.result }}
        run: test "$MATRIX_RESULT" = "success"

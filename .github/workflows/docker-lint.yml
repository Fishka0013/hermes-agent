name: Docker / shell lint

# Lints the container build inputs: Dockerfile (via hadolint) and any shell
# scripts under docker/ (via shellcheck). These catch the class of regression
# the behavioral docker smoke test can't — unquoted variable
# expansions, silently-failing RUN commands, etc.
#
# Rules and ignores are documented in .hadolint.yaml at the repo root.
# shellcheck severity is pinned to `error` so SC1091-style "can't follow
# sourced script" info-level warnings don't fail the job — the .venv
# activate script doesn't exist at lint time.

on:
  workflow_call:
    inputs:
      commit:
        description: Commit to test and build. Empty keeps the triggering commit.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: docker-lint-${{ (github.ref_type == 'tag' || inputs.commit != '') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && inputs.commit == '' }}

jobs:
  lint-docker-and-shell:
    name: Lint Dockerfile (hadolint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.commit }}

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

      - name: Lint Dockerfile (hadolint, sandbox desktop image)
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: docker/sandbox-desktop.Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

      - name: Lint shell scripts (shellcheck)
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/shellcheck.XXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          archive="$work/shellcheck.tar.xz"
          curl -sSfL --retry 3 --retry-delay 5 --max-time 30 \
            -H 'Accept: application/octet-stream' -o "$archive" \
            'https://api.github.com/repos/koalaman/shellcheck/releases/assets/279056942?download=1'
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $archive" | sha256sum --check
          tar -xf "$archive" -C "$work"

          # Preserve shell files and startup files, including executable
          # extensionless init scripts with a shell shebang.
          find docker -type f -print0 > "$work/files"
          result=0
          checked=0
          while IFS= read -r -d '' file; do
            case "${file##*/}" in
              *.sh|*.shlib|*.bash|*.ksh|*.zsh|.bashrc|bashrc|.bash_aliases|.bash_completion|\
              .bash_login|.bash_logout|.bash_profile|bash_profile|suid_profile|.zlogin|zlogin|\
              .zlogout|zlogout|.zprofile|zprofile|.zsenv|zsenv|.zshrc|zshrc|.profile|profile) ;;
              *.*) continue ;;
              *)
                [[ -x "$file" ]] || continue
                head -n 1 "$file" | grep -Eq '^#!.*[/[:space:]](sh|bash|dash|ksh|zsh|ash)([[:space:]]|$)' || continue
                ;;
            esac
            "$work/shellcheck-v0.11.0/shellcheck" --severity=error --format=gcc "$file" || result=1
            checked=$((checked + 1))
          done < "$work/files"
          test "$checked" -gt 0
          exit "$result"
